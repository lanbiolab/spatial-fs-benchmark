name: mouse_brain_graphst_full_size_smoke
output_dir: results/spatial_svg_rebuild_v1/mouse_brain_serial_sections
datasets:
- configs/datasets/mouse_brain_serial_sections.yaml
feature_selection_methods:
- name: morans_i
  params:
    n_neighbors: 8
  n_features:
  - 2000
integration_methods:
- name: graphst
  params:
    epochs: 5
    dim_output: 32
    pca_components: 20
    n_neighbors: 3
    device: auto
tasks:
- name: integration_eval
  params:
    n_neighbors: 15
    max_eval_cells: 12000
- name: clustering_eval
  params:
    n_clusters: 9
    n_neighbors: 8
    silhouette_sample_size: 10000
    max_eval_cells: 12000
- name: alignment_eval
  params:
    n_neighbors: 10
    max_points_per_slice: 2500
n_features:
- 2000
seeds:
- 0
save_embeddings: true

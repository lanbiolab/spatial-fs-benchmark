name: e9p5_embryo_graphst_canonical_v1
output_dir: results/spatial_svg_rebuild_v1/e9p5_embryo
datasets:
- configs/datasets/e9p5_embryo.yaml
feature_selection_methods:
- name: Brennecke
  n_features: &id001
  - 2000
- name: anticor
  params:
    max_cells: 3000
  n_features: *id001
- name: dubstepr
  params:
    max_cells: 5000
  n_features: *id001
- name: hotspot
  params:
    max_cells: 3000
  n_features: *id001
- name: morans_i
  params:
    n_neighbors: 8
  n_features: &id002
  - 2000
- name: nbumi
  params:
    max_cells: 5000
  n_features: *id001
- name: nnsvg
  params:
    n_threads: 4
  n_features: *id002
- name: osca
  n_features: *id001
- name: scPNMF
  params:
    max_cells: 3000
  n_features: *id001
- name: scanpy_cell_ranger
  n_features: *id001
- name: scanpy_cell_ranger_batch
  n_features: *id001
- name: scanpy_pearson
  n_features: *id001
- name: scanpy_pearson_batch
  n_features: *id001
- name: scanpy_seurat
  n_features: *id001
- name: scanpy_seurat_batch
  n_features: *id001
- name: scanpy_seurat_v3
  n_features: *id001
- name: scanpy_seurat_v3_batch
  n_features: *id001
- name: scry
  n_features: *id001
- name: seurat_disp
  n_features: *id001
- name: seurat_mvp
  n_features: *id001
- name: seurat_sct
  params:
    max_cells: 3000
  n_features: *id001
- name: seurat_vst
  n_features: *id001
- name: singleCellHaystack
  params:
    max_cells: 5000
  n_features: *id001
- name: somde
  params:
    spots_per_node: 20
  n_features: *id002
- name: sparkx
  params:
    n_threads: 4
  n_features: *id002
- name: spatialde
  params:
    max_cells_per_slice: 800
  n_features: *id002
- name: statistic_mean
  n_features: *id001
- name: statistic_variance
  n_features: *id001
- name: triku
  params:
    max_cells: 5000
  n_features: *id001
integration_methods:
- name: graphst
  params:
    epochs: 600
    dim_output: 32
    pca_components: 20
    n_neighbors: 3
    device: auto
tasks:
- name: integration_eval
  params:
    n_neighbors: 15
    max_eval_cells: 12000
- name: clustering_eval
  params:
    n_clusters: 12
    n_neighbors: 8
    silhouette_sample_size: 10000
    max_eval_cells: 12000
n_features:
- 2000
seeds:
- 0
- 1
- 2
save_embeddings: true

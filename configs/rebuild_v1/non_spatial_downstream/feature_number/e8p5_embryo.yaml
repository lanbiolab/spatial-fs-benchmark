name: e8p5_embryo_non_spatial_feature_number_rebuild_v1
output_dir: results/spatial_svg_rebuild_v1/e8p5_embryo
datasets:
- configs/datasets/e8p5_embryo.yaml
feature_selection_methods:
- name: scanpy_seurat
  n_features: &id001
  - 100
  - 200
  - 500
  - 1000
  - 5000
  - 10000
- name: scanpy_seurat_batch
  n_features: *id001
- name: scanpy_seurat_v3
  n_features: *id001
- name: scanpy_seurat_v3_batch
  n_features: *id001
- name: scanpy_cell_ranger
  n_features: *id001
- name: scanpy_cell_ranger_batch
  n_features: *id001
- name: scanpy_pearson
  n_features: *id001
- name: scanpy_pearson_batch
  n_features: *id001
- name: seurat_vst
  n_features: *id001
- name: seurat_mvp
  n_features: *id001
- name: seurat_disp
  n_features: *id001
- name: seurat_sct
  params:
    max_cells: 3000
  n_features: *id001
- name: scsegindex
  n_features: *id001
- name: dubstepr
  params:
    max_cells: 5000
  n_features: *id001
- name: nbumi
  params:
    max_cells: 5000
  n_features: *id001
- name: osca
  n_features: *id001
- name: scry
  n_features: *id001
- name: singleCellHaystack
  params:
    max_cells: 5000
  n_features: *id001
- name: Brennecke
  n_features: *id001
- name: scPNMF
  params:
    max_cells: 3000
  n_features: *id001
- name: triku
  params:
    max_cells: 5000
  n_features: *id001
- name: hotspot
  params:
    max_cells: 3000
  n_features: *id001
- name: anticor
  params:
    max_cells: 3000
  n_features: *id001
- name: statistic_mean
  n_features: *id001
- name: statistic_variance
  n_features: *id001
integration_methods:
- name: scvi
  params:
    n_latent: 30
    max_epochs: 100
    batch_size: 2048
- name: cellcharter
  params:
    n_latent: 30
    nhood_layers: 4
    spatial_neighbors: 6
    max_epochs: 100
    batch_size: 2048
tasks:
- name: integration_eval
  params:
    n_neighbors: 15
    max_eval_cells: 12000
- name: clustering_eval
  params:
    n_clusters: 12
    n_neighbors: 8
    silhouette_sample_size: 10000
    max_eval_cells: 12000
n_features: *id001
seeds:
- 0
save_embeddings: true
